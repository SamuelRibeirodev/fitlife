<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitlife - Água</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<body class="tool-page">
    <nav>
        <a href="../index.html" id="logo">
            <i class="fas fa-heartbeat"></i>
            Fitlife
        </a>
        <ul class="nav-links">
            <li><a class="nav-link" href="../index.html">Home</a></li>
            <li><a class="nav-link" href="./imc.html">IMC</a></li>
            <li><a class="nav-link" href="./tmb.html">TMB</a></li>
            <li><a class="nav-link active" href="./water.html">Água</a></li>
        </ul>
    </nav>

    <main class="tool-main">
        <section class="tool-card">
            <div class="tool-title">
                <i class="fas fa-tint"></i>
                <h1>Hidratação</h1>
            </div>

            <p class="water-goal">Meta diária: 2500 ml</p>

            <div class="water-actions">
                <button class="btn water-add" type="button">+ 250ml</button>
                <button class="btn water-reset" type="button">Zerar</button>
            </div>

            <div class="water-progress">
                <p>Meta Atingida!</p>
            </div>

            <p class="water-total">Total: 2500 ml</p>
            <div class="form-actions">
                <a class="btn btn-back" href="../index.html">Voltar</a>
            </div>
        </section>
    </main>

</html>
